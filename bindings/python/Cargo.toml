[package]
name = "pitch-math-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "pitch_math"
crate-type = ["cdylib"]

[dependencies]
pitch_math_rs = { package = "pitch-math", path = "../.." }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

# A separate workspace, so the core crate's `cargo test` never links Python.
[workspace]
