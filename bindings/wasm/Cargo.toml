[package]
name = "pitch-math-wasm"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pitch_math_rs = { package = "pitch-math", path = "../.." }
# Pinned exactly: CI installs the wasm-bindgen CLI of this same version.
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true

# A separate workspace, so the core crate's `cargo test` never builds WebAssembly.
[workspace]
